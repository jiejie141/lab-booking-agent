# ===========================================================================
# Alembic configuration (P1-1)
#
# IMPORTANT: this file must stay ASCII-only.
# alembic reads it with `encoding="locale"`; on a Windows machine whose locale
# is GBK, any non-ASCII byte here raises UnicodeDecodeError before alembic even
# gets to the migration.  Keep the Chinese rationale in migrations/README.md.
#
# Why migrations at all: `create_all()` only creates MISSING tables and never
# evolves EXISTING ones, so adding a column to `users` never reaches an old
# database -- it stops half-way and fails with `no such column:` plus a screen
# of SQLAlchemy stack.  Migrations turn schema changes into ordered, replayable
# scripts, so "which structure is this database" has exactly one answer: its
# revision.
#
# Deliberately NO sqlalchemy.url here: the database the migration talks to must
# be the database the service talks to, so the URL is read in exactly one place
# (env.py, from LAB_DATABASE_URL).  A second copy here would eventually drift
# into "migrated A, service connected to B".
# ===========================================================================
[alembic]
script_location = migrations

# lets `alembic ...` run from the repository root without `pip install -e .`
prepend_sys_path = src

# numeric prefix in the revision filename, so ordering is visible at a glance
file_template = %%(rev)s_%%(slug)s

version_path_separator = os

# No [loggers]/[handlers] sections on purpose:
# those format strings (%(levelname)-5.5s ...) interact badly with configparser
# interpolation, and migration logging buys little -- a failed migration raises,
# and that already goes to stderr.  env.py does not call fileConfig() either.
