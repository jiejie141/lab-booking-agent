# ===========================================================================
# 生产形态：PostgreSQL 16 + API
#
#   docker compose up --build     # api → http://127.0.0.1:8200
#
# 为什么这里用 PostgreSQL 而不是 SQLite：
#   SQLite 的并发安全靠「部分唯一索引 + 忙等待」，够用但更像本地开发的兜底；
#   PostgreSQL 下同样有唯一索引兜底，另外还能用 pg_advisory_xact_lock()
#   对同一台设备做行级串行（见 src/lagent/domain/booking.py）。
# ===========================================================================

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      # api 会依赖这个健康检查：库没就绪就启动会直接建表失败
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      LAB_HOST: 0.0.0.0
      LAB_PORT: "8200"
      LAB_DATABASE_URL: postgresql+asyncpg://lab:lab@db:5432/lab
      # mock = 不联网、不需要 key，开箱即可演示
      LAB_APP_MODE: mock
      LAB_RETRIEVAL_BACKEND: bm25
      # ⚠️ 不给默认值：没设就**起不来**（compose 会在解析阶段报错退出）。
      # 若在这里写死一个密钥，它和仓库里的默认密钥一样是公开的 ——
      # 那等于把 fail-closed 这道闸又关掉了。
      #
      # 想用文件投递（Docker secret / K8s Secret 挂载）时，把这一行换成：
      #   LAB_JWT_SECRET_FILE: /run/secrets/lab_jwt
      # 并在下面挂上 secrets（内容不放环境变量，就不会进 `docker inspect`）：
      #   secrets: [lab_jwt]
      # 两者同时存在时**文件优先**。
      LAB_JWT_SECRET: ${LAB_JWT_SECRET:?请先在 .env 或环境中设置 LAB_JWT_SECRET}
    ports:
      - "8200:8200"
    restart: unless-stopped
    volumes:
      # 运行态产物必须落在卷上。默认两个目录都在 ./var/ 下：
      #   var/backup   —— main.py backup 的产物
      #   var/archive  —— 清扫归档的审计/门禁流水（先落盘后删除，见 sweep.py）
      # 不挂卷的话它们写在容器的可写层里，`docker compose up --build`
      # 一重建就**全没了** —— 而"备份被重建清掉"这件事，
      # 只有在真需要恢复的那一天才会被发现。
      #
      # 取出来的方式：
      #   docker compose cp api:/app/var/backup ./var/
      - labvar:/app/var

volumes:
  pgdata:
  labvar:

# 多副本时才需要的清扫 worker —— 单副本**不要**加。
#
# 清扫默认跑在 api 进程里。多副本时每个副本都会扫一遍：任务本身幂等
# （带条件的 UPDATE + rowcount），所以不会算错，只是白花 CPU。
# 真到了那一步，给 api 加 LAB_SWEEP_ENABLED: "false"，再放开下面这一段：
#
#   sweeper:
#     build: .
#     depends_on:
#       db:
#         condition: service_healthy
#     command: python main.py sweep --loop
#     environment:
#       LAB_DATABASE_URL: postgresql+asyncpg://lab:lab@db:5432/lab
#       LAB_JWT_SECRET: ${LAB_JWT_SECRET:?...}
#     volumes:
#       - labvar:/app/var
#     restart: unless-stopped
#
# 多一个进程就多一份要盯的东西 —— 所以它默认不存在，不是默认开着。
