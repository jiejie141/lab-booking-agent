# ===========================================================================
# CI：每次 push / PR 自动验证
#
# 分六个 job，故意拆开 —— 失败时能一眼看出是哪一类问题：
#   quality  : 静态检查（ruff）+ 类型检查（mypy）+ 单元测试（pytest）
#   frontend : 控制台前端（React + Tailwind）的类型检查、单测与构建
#   smoke    : 真实进程上的端到端验证（评测集 / 重叠竞态 / 清扫演示 / HTTP 越权清单）
#   docker   : 镜像构建 + compose 实机验收（真 PG / 真容器 / 真 HTTP）
#   vector   : 装 chromadb 跑向量检索分支（防降级导致的假绿）
#   postgres : 在真实 PostgreSQL 上跑迁移 + 并发不变式（见 tests/test_postgres.py）
#
# quality 跑两个 Python 版本：pyproject 声明 >=3.10，本地开发用 3.13，
# 两头都测才不会出现「只有我的机器能跑」。
# ===========================================================================
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# 同一分支上的旧运行没有价值，直接取消，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 只读仓库内容，不申请任何写权限
permissions:
  contents: read

jobs:
  # =========================================================================
  # 控制台前端：类型检查 + 组件测试 + 构建
  #
  # 为什么单独一个 job 而不是塞进 quality：
  #   ① quality 是 Python 3.10/3.13 矩阵，前端与 Python 版本毫无关系 ——
  #      塞进去等于白跑两遍同样的东西；
  #   ② 失败信号要能分辨。前端挂了和 ruff 挂了是两种完全不同的修法，
  #      混在一个 job 里只能靠翻日志。
  #
  # 为什么必须跑 build 而不只是 tsc/test：
  #   npm run build 是 tsc --noEmit && vite build。只跑测试的话，
  #   「测试全绿但打包失败」（比如 import 了只在测试环境存在的模块、
  #   或者 Tailwind 的 @source 指错）会一路溜到镜像构建才炸。
  #   这里把它提前到几分钟内可见。
  # =========================================================================
  frontend:
    name: 控制台前端（React + Tailwind）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/lagent/web/ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 与 Dockerfile 里的 node:22-slim 对齐：本地/CI/镜像三处同一大版本
          node-version: "22"
          cache: npm
          cache-dependency-path: src/lagent/web/ui/package-lock.json

      # npm ci 而不是 npm install：前者严格按 package-lock.json 装，
      # 装的和你本机、和镜像里完全一致；后者会顺手更新 lock 与依赖树。
      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 组件测试
        run: npm test

      - name: 构建产物
        run: npm run build

      # 构建完再确认产物真的是「能被后端托管」的那个形状。
      # 光看 exit code 不够：vite 把产物默默放到了别的 outDir（比如相对路径
      # 算错），build 依然成功，而 api.py 会 503。这一步让那种情况当场红。
      - name: 确认产物落到了后端要读的目录
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "::error::dist/index.html 不存在，产物没落到 src/lagent/web/dist"; exit 1; }
          grep -q '/assets-app/' dist/index.html || { echo "::error::index.html 里没有 /assets-app/ 引用，vite 的 base 配错了"; exit 1; }
          ls -la dist dist/assets

  quality:
    name: 静态检查 + 单测 (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 静态检查工具不进 requirements.txt：它们不是运行依赖
          pip install "ruff>=0.9" "mypy>=1.11"
          pip install "pytest-cov>=5.0"

      # 2026-10-11 加：把「依赖解析出界」这件事在 CI 里变成**硬失败**。
      #
      # 起因见下一段注释 —— requirements 只写下限时，SQLAlchemy 2.1 抬高了
      # requires_python，py3.10 被解析到 2.0、py3.13 拿到 2.1，两个 job
      # 静默地测两套栈。当时只加了「打印版本」，那让问题**可见**，
      # 但没让它**不可发生**：下一个人照样会被 pip 悄悄带上新大版本。
      #
      # 现在 requirements.txt 里每条都带上限，CI 再校验一步：
      # 只要解析结果越过了声明区间，这里直接红。代价是每次 CI 多跑几秒，
      # 换的是「版本漂移再也不会无声发生」。
      - name: 校验依赖声明边界
        run: python scripts/check_deps.py

      # 把「这个 job 到底测的是哪套栈」打出来。
      #
      # 起因是一次真实的排查：py3.13 的 mypy 报错、py3.10 却全绿，而两边跑的是
      # 同一份 mypy 版本、同一份配置。真因是 requirements 只写了 >= 下限，
      # 而 SQLAlchemy 2.1 抬高了 requires_python —— py3.10 于是被解析到 2.0，
      # py3.13 拿到 2.1，**两个 job 静默地在测两套不同的栈**。
      # mypy 的输出本来就依赖「装了哪些带类型标注的包」，所以这类差异
      # 第一个暴露它的地方永远是类型检查，而且看不出原因。
      # 一行版本号能让下次不用再查一遍。
      - name: 记录本 job 的依赖栈
        run: |
          python -c "import sys; print('python', sys.version.split()[0])"
          python -c "import sqlalchemy, pydantic; print('sqlalchemy', sqlalchemy.__version__, '| pydantic', pydantic.__version__)"
          python -m mypy --version

      - name: ruff（lint）
        run: ruff check --output-format=github .

      # 这里刻意**不**跑 ruff format --check：
      # 本项目的手写风格是「同类参数按语义分组压行」（见 booking.py 的下单调用），
      # 而 ruff format 会把它拆成一参数一行。全仓重排 30 个文件属于纯噪声改动，
      # 应该单独一个 commit 做，不该混在功能提交里 —— 否则 diff 没法审。
      # 所以 CI 只强制 lint（真问题），格式靠人工一致性。

      - name: mypy（类型检查，配置见 pyproject.toml）
        run: mypy

      # 前后端契约目前是手写的：schemas.py 由人维护、前端按它拼请求。
      # 字段改名/必填改可选这类改动编译期没有任何提示，前端只会拿到 422
      # 或者一个静默取不到的字段。把 schema 落盘 + 在这里比对，
      # 它就从"上线后才发现"变成一次明确的红灯。
      - name: OpenAPI 契约未漂移
        run: python scripts/check_openapi.py --check

      - name: pytest（单元 + 集成 + 并发）
        # 经 ci_run.py 包装：失败时把 FAILED/ERROR 行抬成注解 ——
        # 原始日志要鉴权才能读，注解不用（见 scripts/ci_run.py 的说明）。
        run: python scripts/ci_run.py --match '^(FAILED|ERROR)' --tail 20 -- python -m pytest -q

      # 覆盖率：只强制**总量下限**，不强制每个文件。
      #
      # 为什么不设 per-file 门槛：本项目有几个模块是“结构性低覆盖”，
      #   它们不是“没测”，而是“这类代码在 CI 里没法测”：
      #     - cli.py (39%)       —— 命令行入口，靠 scripts/ 下的脚本驱动
      #     - llm.py (76%)       —— 真实 LLM 调用，没 API key 时走 mock 分支
      #     - server.py (0%)     —— uvicorn 启动入口，由 smoke job 真实进程覆盖
      #     - evaluation.py (35%)—— 评测集，需真实模型，mock 下只能覆盖骨架
      #   给它们设门槛只会逼人写“为了覆盖而覆盖”的假测试，
      #   或者把门槛一路调低到没有意义。
      #
      # 那为什么还要一个总量门槛：此前项目**完全没有覆盖率度量**，
      #   于是“测试够不够”只能靠感觉。85% 是当前实测值，
      #   把门槛定在 82%（留 3 个点抖动空间）是为了让它成为
      #   **防倒退的闸门**而不是理想值 —— 掉了就红灯，涨了不奖励。
      - name: 覆盖率（防倒退闸门，非理想值）
        run: |
          python -m pytest -q --cov=src/lagent --cov-report=term-missing --cov-fail-under=82


  smoke:
    name: 端到端验证（真实进程）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 评测集（意图 / 槽位 / 端到端通过率）
        run: python scripts/ci_run.py --tail 12 -- python main.py eval

      - name: 区间重叠竞态（P0-1 的回归：必须恰好 1 条成功）
        run: python scripts/ci_run.py --tail 12 -- python scripts/overlap_race.py

      - name: 后台清扫端到端（P1-2：忘刷出场 / 过期预约 / 归档）
        run: python scripts/ci_run.py --tail 12 -- python scripts/sweep_demo.py

      - name: HTTP 冒烟 + 越权清单（起真实 uvicorn，跑渗透项）
        run: python scripts/ci_run.py --tail 12 -- python scripts/smoke_http.py

  # -------------------------------------------------------------------------
  # 镜像 + compose 实机验收
  #
  # 原来这里只 `docker build` —— 那只能证明"Dockerfile 语法对"。
  # 真正要证明的是"按 README 的步骤起来之后它能不能用"，那必须真的把栈起来一次：
  # 迁移在真 PG 上跑不跑得到 head、容器健康检查转不转 healthy、
  # 端口映射对不对、控制台能不能打开。这些单测与 smoke 都覆盖不到
  # （它们跑在一次性 SQLite 库上）。
  # -------------------------------------------------------------------------
  docker:
    name: 镜像构建 + compose 实机验收
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # 只是个 CI 里用一次的假密钥：compose 要求这个变量存在（fail-closed），
      # 但它不对外，用完就随 runner 一起消失。
      LAB_JWT_SECRET: ci-only-secret-please-do-not-reuse
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 起栈（同时验证 Dockerfile 与编排）
        run: docker compose up -d --build

      - name: 等它就绪（不等就开测的话，第一步会以"连不上"失败，看起来像代码问题）
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8200/api/health >/dev/null 2>&1; then
              echo "已就绪（第 ${i} 次探测）"
              exit 0
            fi
            sleep 2
          done
          echo "::error::等待 120 秒仍未就绪，下面是容器日志"
          docker compose logs --tail 60
          exit 1

      # 试运行时撞出来的两个缺口，这一条一起守：
      #
      # ① 镜像里没装 pg_dump → `main.py backup` 在容器里直接抛 BackupError。
      #    单元测试覆盖的是 SQLite 路径（VACUUM INTO），PG 那条一直只有
      #    "代码看起来对"；只 `docker build` 也发现不了（Dockerfile 语法完全正确）。
      #
      # ② ★ 装了 pg_dump 也不够 —— **版本要对**。客户端比服务端新时，
      #    dump 头里会带服务端不认识的 GUC：用 17 的 pg_dump 导 16 的库，
      #    文件里有 `SET transaction_timeout = 0`，恢复到 16 上直接失败
      #      ERROR: unrecognized configuration parameter "transaction_timeout"
      #    只验"备份成功"永远发现不了这件事，所以这一步**真的恢复一次并逐表比对行数**。
      #    这条规则说起来老套（"备份要演练"），但它是刚才真被撞出来的。
      # 经 ci_run.py 包装：失败时把关键行抬成注解（原始日志要鉴权，注解不用）。
      - name: 备份 + 恢复演练（只验备份不够：dump 可能恢复不回来）
        run: python scripts/ci_run.py --tail 30 -- bash scripts/backup_drill.sh

      - name: 端到端验收（真 PG / 真容器 / 真 HTTP）
        run: python scripts/ci_run.py --tail 25 -- python scripts/accept_deploy.py

      - name: 收尾（无论成败都要清理，否则 runner 上留着容器）
        if: always()
        run: |
          docker compose logs --tail 40 || true
          docker compose down -v || true

  # -------------------------------------------------------------------------
  # PostgreSQL 真实链路
  #
  # 为什么必须单独一个 job：整套单测都跑在 SQLite 上（conftest 把库地址硬编码成
  # sqlite+aiosqlite），而**生产形态是 PG** —— compose 里写的是 postgresql+asyncpg，
  # 并发那段还用了 pg_advisory_xact_lock()。没有这个 job 之前，那条路径
  # 一行都没被执行过：迁移能否在空库上走通、部分唯一索引的 postgresql_where
  # 有没有真写进 DDL、advisory lock 的 SQL 在 asyncpg 下能不能过，
  # 全靠"读代码觉得没问题"。
  #
  # 用 GitHub runner 自带的 service container 起 PG，不需要在开发机上装任何东西
  # （本机的 Docker 起不来时也照样能验，这正是它比"本地跑一遍"更可靠的地方）。
  # -------------------------------------------------------------------------
  # 向量检索路径：装了 chromadb 才跑
  #
  # 为什么单独一个 job 而不是装进 quality：
  #   requirements.txt 里 chromadb 是**注释掉的**（它不是运行依赖，
  #   没装时 hybrid 会设计内降级回 BM25）。于是默认环境下
  #   ChromaVectorIndex 那整条代码路径**从没被执行过** ——
  #   不是「测了没过」，是「根本没跑」。
  #
  #   把它装进 quality job 会拖慢所有 Python 版本、且掩盖降级行为本身
  #   （降级也是要验的）；单独一个 job 的好处是：
  #     绿 = 向量路径真跑通了
  #     红 = 向量路径坏了，而 quality 的绿说明降级路径没坏
  #   两者信息量不同，混在一起就都看不出来了。
  vector:
    name: 向量检索路径（装 chromadb）
    runs-on: ubuntu-latest
    # 25 分钟不够：chromadb 首次使用要下载 all-MiniLM-L6-v2 的 ONNX 模型
    # （约 79MB）。本机实测下载速率只有 ~34KB/s，光下模型就要 40 分钟。
    # CI runner 的带宽通常好得多，但仍需留出余量 —— 超时的表现是 job 被杀，
    # 而那和「测试失败」看起来不一样，容易被误读成基础设施抖动。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: 安装依赖 + chromadb
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "chromadb>=0.5.0"

      # 先确认「这次确实是装上了」再跑测试。
      #
      # 不加这一步的话，万一 chromadb 装不上（版本冲突、平台没 wheel），
      # 测试会因为降级而全部跳过、job 照样绿 ——
      # **看起来通过了，实际什么都没验**。这是可选依赖 job 最容易的假绿。
      - name: 确认 chromadb 真的可用（防止降级导致的假绿）
        run: |
          python -c "import chromadb; print('chromadb', chromadb.__version__)"
          python -c "from lagent.knowledge.retriever import ChromaVectorIndex; print('import ok')"

      # 跑全部检索测试。装了 chromadb 之后 test_retrieval.py 里那句
      # `if vector_ok:` 会走 True 分支，断言 HybridRetriever 真的被建出来 ——
      # 这条分支在本地默认环境里永远不会执行。
      # 预热：先把模型下下来。
      #
      # 不单独预热的话，第一步下载会和 pytest 的超时/输出混在一起，
      # 而且 79MB 的进度条会刷满日志、把真正的失败信息冲走。
      # 单独一步的好处是：如果这一步挂了，一眼就知道是“模型没下下来”，
      # 不是“代码有问题”。
      - name: 预热 ONNX 嵌入模型（首次约 79MB）
        run: |
          python -c "
          import sys; sys.path.insert(0, 'src')
          from lagent.knowledge.retriever import ChromaVectorIndex, load_corpus
          print('available:', ChromaVectorIndex(load_corpus()).available())
          "

      - name: 检索测试（此时向量分支会被真正执行）
        run: python -m pytest tests/test_retrieval.py -q -rs

  postgres:
    name: PostgreSQL 真实链路
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: lab
          POSTGRES_DB: lab
        ports:
          - 5432:5432
        # 不等健康就开跑的话，第一步 migrate 会以"连不上库"失败 ——
        # 那个报错看起来像代码问题，其实是启动顺序问题。
        options: >-
          --health-cmd "pg_isready -U lab -d lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LAB_DATABASE_URL: postgresql+asyncpg://lab:lab@127.0.0.1:5432/lab
      LAB_TEST_PG_URL: postgresql+asyncpg://lab:lab@127.0.0.1:5432/lab
      LAB_ALLOW_INSECURE_DEFAULTS: "true"
      # 这个 job 的唯一意义就是跑 PG 用例。少了 URL 时必须**报错**，
      # 而不是让那些用例静默跳过、job 挂着一片绿。
      LAB_REQUIRE_PG_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖（含 asyncpg）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # asyncpg 在 requirements.txt 里是注释掉的可选项（本地跑 SQLite 用不上），
          # 但生产走的就是它 —— 这个 job 必须真的装上。
          pip install "asyncpg>=0.29"

      - name: 空库 → head 的迁移（上线时走的就是这一条命令）
        run: python main.py migrate

      - name: PostgreSQL 专项用例
        run: python scripts/ci_run.py --match '^(FAILED|ERROR)' --tail 20 -- python -m pytest tests/test_postgres.py -q
