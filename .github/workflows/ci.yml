# ===========================================================================
# CI：每次 push / PR 自动验证
#
# 分三个 job，故意拆开 —— 失败时能一眼看出是哪一类问题：
#   quality : 静态检查（ruff）+ 类型检查（mypy）+ 单元测试（pytest）
#   smoke   : 真实进程上的端到端验证（评测集 / 重叠竞态 / HTTP 越权清单）
#   docker  : 镜像能不能构建出来
#
# quality 跑两个 Python 版本：pyproject 声明 >=3.10，本地开发用 3.13，
# 两头都测才不会出现「只有我的机器能跑」。
# ===========================================================================
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# 同一分支上的旧运行没有价值，直接取消，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 只读仓库内容，不申请任何写权限
permissions:
  contents: read

jobs:
  quality:
    name: 静态检查 + 单测 (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 静态检查工具不进 requirements.txt：它们不是运行依赖
          pip install "ruff>=0.9" "mypy>=1.11"

      - name: ruff（lint）
        run: ruff check --output-format=github .

      # 这里刻意**不**跑 ruff format --check：
      # 本项目的手写风格是「同类参数按语义分组压行」（见 booking.py 的下单调用），
      # 而 ruff format 会把它拆成一参数一行。全仓重排 30 个文件属于纯噪声改动，
      # 应该单独一个 commit 做，不该混在功能提交里 —— 否则 diff 没法审。
      # 所以 CI 只强制 lint（真问题），格式靠人工一致性。

      - name: mypy（类型检查，配置见 pyproject.toml）
        run: mypy

      - name: pytest（单元 + 集成 + 并发）
        run: pytest -q

  smoke:
    name: 端到端验证（真实进程）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 评测集（意图 / 槽位 / 端到端通过率）
        run: python main.py eval

      - name: 区间重叠竞态（P0-1 的回归：必须恰好 1 条成功）
        run: python scripts/overlap_race.py

      - name: HTTP 冒烟 + 越权清单（起真实 uvicorn，跑渗透项）
        run: python scripts/smoke_http.py

  docker:
    name: 镜像构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像（不推送，只验证 Dockerfile 可用）
        run: docker build -t lab-booking-agent:ci .
