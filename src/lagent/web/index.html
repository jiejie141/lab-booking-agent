<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lab-booking-agent · 智能实验室预约控制台</title>
<style>
:root{
  --bg:#080c12; --bg-grid:#0d141d; --panel:#0f1620; --panel-2:#141d29; --panel-3:#1a2534;
  --border:#22303f; --border-soft:#1a2432; --text:#e8eef6; --text-dim:#9aabc0; --text-faint:#5f7governed;
  --text-faint:#61748a; --accent:#3d9bff; --accent-2:#8b5cff; --accent-soft:rgba(61,155,255,.12);
  --ok:#31d68f; --warn:#ffb547; --danger:#ff5f6d; --chip:rgba(255,255,255,.05);
  --shadow:0 1px 2px rgba(0,0,0,.4); --radius:12px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
}
[data-theme="light"]{
  --bg:#f4f7fb; --bg-grid:#e9eff7; --panel:#ffffff; --panel-2:#f7fafd; --panel-3:#eef4fa;
  --border:#d6e0ec; --border-soft:#e6edf5; --text:#0e1725; --text-dim:#5a6c81; --text-faint:#8b9aad;
  --accent:#1a73e8; --accent-2:#6b3fe0; --accent-soft:rgba(26,115,232,.08);
  --ok:#0f9d58; --warn:#c77700; --danger:#d93025; --chip:rgba(14,23,37,.04);
  --shadow:0 1px 2px rgba(16,32,56,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); font-family:var(--sans); font-size:14px; line-height:1.6;
  background-image:linear-gradient(var(--bg-grid) 1px,transparent 1px),linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px);
  background-size:48px 48px; min-height:100vh;
}
.wrap{max-width:1360px;margin:0 auto;padding:0 20px 64px}
header.top{
  position:sticky; top:0; z-index:30; backdrop-filter:blur(12px);
  background:color-mix(in srgb,var(--bg) 88%,transparent); border-bottom:1px solid var(--border-soft);
}
.top-in{max-width:1360px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:.2px}
.brand .mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;font-size:13px;color:#fff}
.brand small{font-weight:400;color:var(--text-faint);font-size:12px;margin-left:2px}
.spacer{flex:1}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--border);background:var(--panel);font-size:12px;color:var(--text-dim)}
.badge b{color:var(--text);font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent)}
.dot.warn{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 20%,transparent)}
.dot.bad{background:var(--danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 20%,transparent)}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--panel);color:var(--text-dim);cursor:pointer;display:grid;place-items:center;transition:.16s}
.icon-btn:hover{color:var(--text);border-color:var(--accent);background:var(--accent-soft)}
.icon-btn svg{width:16px;height:16px}
h2.sec{font-size:13px;font-weight:500;color:var(--text-dim);letter-spacing:.6px;text-transform:uppercase;margin:0 0 10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent);opacity:.7}
.stat.v2::after{background:var(--accent-2)} .stat.v3::after{background:var(--ok)} .stat.v4::after{background:var(--warn)}
.stat .k{font-size:11px;color:var(--text-faint);letter-spacing:.5px}
.stat .n{font-family:var(--mono);font-size:24px;font-weight:600;margin-top:2px}
.cols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:1020px){.cols{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{padding:13px 16px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;gap:10px}
.card-h .t{font-weight:500;font-size:14px}
.card-b{padding:16px}
.tabs{display:flex;gap:4px;padding:4px;background:var(--panel-3);border-radius:10px;border:1px solid var(--border-soft)}
.tab{padding:6px 12px;border-radius:7px;font-size:12px;color:var(--text-dim);cursor:pointer;border:none;background:transparent;transition:.16s;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{background:var(--panel);color:var(--text);border:1px solid var(--border)}
select,input,textarea{font-family:inherit;font-size:13px;color:var(--text);background:var(--panel-2);border:1px solid var(--border);border-radius:9px;padding:9px 11px;outline:none;transition:.16s;width:100%}
select:focus,input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:74px;line-height:1.65}
label.f{display:block;font-size:11px;color:var(--text-faint);margin:0 0 5px;letter-spacing:.4px}
.row{display:flex;gap:10px;align-items:flex-end}
.row>*{flex:1}
.btn{padding:9px 16px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-size:13px;font-weight:500;cursor:pointer;transition:.16s;white-space:nowrap}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--text-dim);border-color:var(--border)}
.btn.ghost:hover{color:var(--text);border-color:var(--accent)}
.btn.sm{padding:5px 11px;font-size:12px}
.msgs{display:flex;flex-direction:column;gap:12px;max-height:420px;overflow-y:auto;padding-right:4px}
.msg{display:flex;gap:9px;animation:rise .3s ease both}
.msg .who{width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:600}
.msg.u .who{background:var(--accent-soft);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.msg.a .who{background:var(--chip);color:var(--accent-2);border:1px solid color-mix(in srgb,var(--accent-2) 30%,transparent)}
.msg .bub{background:var(--panel-2);border:1px solid var(--border-soft);border-radius:10px;padding:9px 12px;white-space:pre-wrap;word-break:break-word;flex:1;font-size:13px}
.msg.u .bub{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 22%,transparent)}
.msg.err .bub{border-color:var(--danger);color:var(--danger)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.props{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.prop{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--panel-2);display:flex;gap:10px;align-items:flex-start;transition:.16s}
.prop:hover{border-color:var(--accent);background:var(--panel-3)}
.prop .idx{font-family:var(--mono);font-size:12px;color:var(--text-faint);min-width:18px}
.prop .main{flex:1;min-width:0}
.prop .line1{font-weight:500;font-size:13px}
.prop .line2{font-size:11.5px;color:var(--text-dim);font-family:var(--mono);margin-top:2px}
.relax{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.rc{font-size:11px;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.score{font-family:var(--mono);font-size:11px;color:var(--text-faint);white-space:nowrap}
.trace{margin-top:10px;border-top:1px dashed var(--border-soft);padding-top:10px}
.tl{display:flex;flex-direction:column;gap:5px}
.tlrow{display:grid;grid-template-columns:74px 1fr 62px;gap:8px;align-items:center;font-size:11.5px}
.tlrow .n{font-family:var(--mono);color:var(--accent)}
.tlrow .d{color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlrow .m{font-family:var(--mono);color:var(--text-faint);text-align:right}
.bar{height:3px;border-radius:2px;background:var(--accent);opacity:.55;min-width:2px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border-soft)}
th{font-size:11px;color:var(--text-faint);font-weight:500;letter-spacing:.4px;text-transform:uppercase}
tbody tr{transition:.14s}
tbody tr:hover{background:var(--panel-2)}
td .mono{font-family:var(--mono)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--border);color:var(--text-dim)}
.tag.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.tag.bad{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent);background:color-mix(in srgb,var(--danger) 10%,transparent)}
.filters{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.filters>*{flex:1;min-width:120px}
.empty{text-align:center;color:var(--text-faint);padding:28px 10px;font-size:13px}
.skel{background:linear-gradient(90deg,var(--panel-2) 25%,var(--panel-3) 37%,var(--panel-2) 63%);background-size:400% 100%;animation:sh 1.3s ease infinite;border-radius:8px}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
.sk-row{height:34px;margin-bottom:8px}
.sk-card{height:78px;margin-bottom:10px}
.cite{border-left:2px solid var(--accent-2);padding:6px 0 6px 10px;margin-bottom:8px}
.cite .h{font-size:12.5px;font-weight:500}
.cite .x{font-size:12px;color:var(--text-dim);margin-top:2px}
.cite .s{font-family:var(--mono);font-size:11px;color:var(--text-faint)}
.hint{font-size:11.5px;color:var(--text-faint);margin-top:6px}
.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:9px;padding:10px 14px;font-size:13px;box-shadow:0 6px 22px rgba(0,0,0,.28);animation:rise .24s ease both;max-width:330px}
.toast.err{border-left-color:var(--danger)}
.toast.ok{border-left-color:var(--ok)}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sq{width:100%;display:grid;grid-template-columns:46px 1fr;gap:9px;align-items:center;font-size:11.5px;margin-top:7px}
.sq .lb{color:var(--text-faint);font-family:var(--mono)}
.sq .track{height:6px;border-radius:3px;background:var(--panel-3);overflow:hidden;display:flex}
.sq .seg{height:100%}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <span class="mark">LB</span>
      <span>lab-booking-agent<small>智能实验室预约</small></span>
    </div>
    <div class="spacer"></div>
    <span class="badge" id="badge-mode"><span class="dot" id="dot-health"></span>连接中…</span>
    <span class="badge">检索 <b id="badge-backend">–</b></span>
    <span class="badge">时段 <b id="badge-now">–</b></span>
    <button class="icon-btn" id="btn-theme" title="切换主题" aria-label="切换主题"></button>
  </div>
</header>

<div class="wrap">
  <div class="stats" id="stats">
    <div class="stat"><div class="k">实验室</div><div class="n" id="st-labs">–</div></div>
    <div class="stat v2"><div class="k">设备</div><div class="n" id="st-equip">–</div></div>
    <div class="stat v3"><div class="k">有效预约</div><div class="n" id="st-active">–</div></div>
    <div class="stat v4"><div class="k">预约总数</div><div class="n" id="st-res">–</div></div>
  </div>

  <div class="cols">
    <!-- ============ 左：对话 ============ -->
    <section class="card">
      <div class="card-h">
        <span class="t">对话协商</span>
        <div class="spacer"></div>
        <span class="badge" id="badge-agent">–</span>
      </div>
      <div class="card-b">
        <div class="row" style="margin-bottom:14px">
          <div style="flex:0 0 190px">
            <label class="f">当前身份（决定准入资质）</label>
            <select id="sel-user"></select>
          </div>
          <div style="flex:0 0 auto">
            <button class="btn ghost sm" id="btn-reset">新会话</button>
          </div>
        </div>

        <div class="msgs" id="msgs">
          <div class="msg a"><div class="who">AI</div><div class="bub">我是实验室预约助手。

直接说需求即可，例如「明天下午两点想用荧光光谱仪两小时」。
遇到时段冲突我会给出**带取舍说明**的备选方案，而不是只说「约不上」。</div></div>
        </div>

        <div style="margin-top:14px">
          <label class="f">你来说</label>
          <textarea id="inp-msg" placeholder="例如：明天下午两点想用荧光光谱仪两小时"></textarea>
          <div class="hint" id="hint-inline"></div>
          <div class="row" style="margin-top:10px">
            <button class="btn" id="btn-send">发送</button>
          </div>
          <div class="pill-row" id="quick"></div>
        </div>
      </div>
    </section>

    <!-- ============ 右：数据 ============ -->
    <section class="card">
      <div class="card-h">
        <div class="tabs" id="tabs">
          <button class="tab on" data-tab="labs">实验室与设备</button>
          <button class="tab" data-tab="res">预约记录</button>
          <button class="tab" data-tab="kb">规范检索</button>
        </div>
      </div>
      <div class="card-b">
        <div id="pane-labs">
          <div id="labs-box"><div class="skel sk-card"></div><div class="skel sk-card"></div></div>
        </div>

        <div id="pane-res" hidden>
          <div class="filters">
            <select id="flt-user"><option value="">全部用户</option></select>
            <select id="flt-status">
              <option value="">全部状态</option>
              <option value="pending">待确认</option>
              <option value="confirmed">已确认</option>
              <option value="cancelled">已取消</option>
              <option value="completed">已完成</option>
              <option value="expired">已过期</option>
            </select>
          </div>
          <div id="res-box"><div class="skel sk-row"></div><div class="skel sk-row"></div><div class="skel sk-row"></div></div>
        </div>

        <div id="pane-kb" hidden>
          <div class="row">
            <input id="inp-q" placeholder="例如：离心机 配平 / 准入资质 培训">
            <button class="btn" id="btn-q" style="flex:0 0 auto">检索</button>
          </div>
          <div class="hint">检索《实验室准入与设备使用规范》，命中会标注由哪几路召回。</div>
          <div id="kb-box" style="margin-top:12px"></div>
        </div>
      </div>
    </section>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
(function(){
"use strict";
const $ = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- 主题 ---------- */
const THEME_KEY="lagent-theme";
function applyTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  $("#btn-theme").innerHTML = t==="dark"
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>';
  try{localStorage.setItem(THEME_KEY,t);}catch(e){}
}
(function initTheme(){
  let saved=null; try{saved=localStorage.getItem(THEME_KEY);}catch(e){}
  const prefers = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light":"dark";
  applyTheme(saved || prefers);
})();
$("#btn-theme").addEventListener("click",()=>{
  applyTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");
});

/* ---------- 基础工具 ---------- */
function toast(msg,kind){
  const el=document.createElement("div");
  el.className="toast "+(kind||"");
  el.textContent=msg;
  $("#toasts").appendChild(el);
  setTimeout(()=>{el.style.opacity="0";setTimeout(()=>el.remove(),240);},3200);
}
async function api(path,opts){
  const r=await fetch(path,Object.assign({headers:{"Content-Type":"application/json"}},opts||{}));
  let body=null;
  try{body=await r.json();}catch(e){}
  if(!r.ok){
    const detail=(body&&(body.detail||body.message))||("HTTP "+r.status);
    throw new Error(detail);
  }
  return body;
}
const SKEL = {card:'<div class="skel sk-card"></div>',row:'<div class="skel sk-row"></div>'};
const skel=(n,t)=>SKEL[t||"row"].repeat(n);

/* ---------- 状态 ---------- */
const state={ users:[], equipment:new Map(), session:"web-"+Math.random().toString(36).slice(2,8), busy:false };

/* ---------- 顶部与统计 ---------- */
async function loadHealth(){
  try{
    const h=await api("/api/health");
    $("#dot-health").className="dot"+(h.agent_available?"":" warn");
    $("#badge-mode").innerHTML='<span class="dot'+(h.agent_available?"":" warn")+'" id="dot-health"></span>'+esc(h.app_mode)+" · "+esc(h.database);
    $("#badge-backend").textContent=h.retrieval_backend+(h.retrieval_degraded_reason?"（降级）":"");
    $("#badge-now").textContent=(h.now||"").slice(11,16);
    $("#badge-agent").innerHTML = h.agent_available
      ? '<span class="dot"></span>Agent 在线' : '<span class="dot warn"></span>Agent 降级（引导式表单）';
    $("#st-labs").textContent=h.counts.labs;
    $("#st-equip").textContent=h.counts.equipment;
    $("#st-active").textContent=h.counts.active;
    $("#st-res").textContent=h.counts.reservations;
    if(h.retrieval_degraded_reason) toast("检索已降级："+h.retrieval_degraded_reason,"err");
  }catch(e){
    $("#dot-health").className="dot bad";
    $("#badge-mode").innerHTML='<span class="dot bad"></span>连接失败';
    toast("无法连接后端："+e.message,"err");
  }
}

/* ---------- 用户 ---------- */
async function loadUsers(){
  try{
    state.users=await api("/api/users");
    const sel=$("#sel-user");
    sel.innerHTML=state.users.map(u=>
      `<option value="${u.id}">${esc(u.username)}（${u.certs&&u.certs.length?esc(u.certs.join("/")):"无资质"}）</option>`).join("");
    const f=$("#flt-user");
    f.innerHTML='<option value="">全部用户</option>'+state.users.map(u=>`<option value="${u.id}">${esc(u.username)}</option>`).join("");
    const zhang=state.users.find(u=>(u.certs||[]).length===1);
    if(zhang) sel.value=zhang.id;
  }catch(e){toast("加载用户失败："+e.message,"err");}
}

/* ---------- 实验室与设备 ---------- */
async function loadLabs(){
  const box=$("#labs-box");
  box.innerHTML=skel(3,"card");
  try{
    const labs=await api("/api/labs");
    labs.forEach(l=>l.equipment.forEach(e=>state.equipment.set(e.id,e)));
    box.innerHTML=labs.map(l=>{
      const rows=l.equipment.map(e=>{
        const st=e.status==="normal"
          ? '<span class="tag ok">可用</span>'
          : `<span class="tag bad">${esc(e.status)}</span>`;
        const cert=e.requires_training?'<span class="tag warn">需资质</span>':'<span class="tag">免资质</span>';
        return `<tr><td class="mono">${esc(e.code)}</td><td>${esc(e.name)}</td><td>${esc(e.category)}</td>
          <td class="mono">${e.max_hours}h</td><td>${cert}</td><td>${st}</td></tr>`;
      }).join("");
      const oh=l.open_hours||{};
      const fmt=v=>v?`${v[0]}-${v[1]}`:"—";
      return `<div style="margin-bottom:20px">
        <div style="display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:8px">
          <b style="font-size:14px">${esc(l.label)}</b>
          <span class="tag">容纳 ${l.capacity} 人</span>
          <span class="tag">工作日 ${esc(fmt(oh.weekday))}</span>
          <span class="tag">周末 ${esc(fmt(oh.weekend))}</span>
        </div>
        <div style="color:var(--text-faint);font-size:12px;margin-bottom:8px">${esc(l.note||"")}</div>
        <table><thead><tr><th>编号</th><th>名称</th><th>类别</th><th>单次上限</th><th>准入</th><th>状态</th></tr></thead>
        <tbody>${rows}</tbody></table>
      </div>`;
    }).join("");
  }catch(e){box.innerHTML='<div class="empty">加载失败：'+esc(e.message)+"</div>";}
}

/* ---------- 预约记录 ---------- */
const STATUS_TAG={pending:"warn",confirmed:"ok",cancelled:"",completed:"ok",expired:"bad"};
const STATUS_CN={pending:"待确认",confirmed:"已确认",cancelled:"已取消",completed:"已完成",expired:"已过期"};

async function loadReservations(){
  const box=$("#res-box");
  box.innerHTML=skel(3,"row");
  const uid=$("#flt-user").value, st=$("#flt-status").value;
  try{
    let rows=await api("/api/reservations"+(uid?("?user_id="+encodeURIComponent(uid)):""));
    if(st) rows=rows.filter(r=>r.status===st);
    if(!rows.length){box.innerHTML='<div class="empty">没有匹配的预约记录</div>';return;}

    const total=rows.length;
    const dist={}; rows.forEach(r=>{dist[r.status]=(dist[r.status]||0)+1;});
    const colors={pending:"var(--warn)",confirmed:"var(--ok)",cancelled:"var(--text-faint)",completed:"var(--accent)",expired:"var(--danger)"};
    const bar=Object.keys(dist).map(k=>
      `<div class="seg" style="width:${(dist[k]/total*100).toFixed(1)}%;background:${colors[k]||"var(--border)"}" title="${esc(STATUS_CN[k]||k)} ${dist[k]}"></div>`).join("");

    const table=rows.map(r=>{
      const canCancel=r.status==="pending"||r.status==="confirmed";
      return `<tr>
        <td class="mono">#${r.id}</td>
        <td>${esc(r.equipment_name)}<div style="color:var(--text-faint);font-size:11px">${esc(r.lab_label)}</div></td>
        <td class="mono">${esc(r.slot)}</td>
        <td><span class="tag ${STATUS_TAG[r.status]||""}">${esc(STATUS_CN[r.status]||r.status)}</span></td>
        <td>${canCancel?`<button class="btn ghost sm" data-cancel="${r.id}">取消</button>`:""}</td>
      </tr>`;
    }).join("");

    box.innerHTML=`<div class="sq"><span class="lb">分布</span><span class="track">${bar}</span></div>
      <table style="margin-top:10px"><thead><tr><th>ID</th><th>设备</th><th>时段</th><th>状态</th><th></th></tr></thead>
      <tbody>${table}</tbody></table>`;

    $$("[data-cancel]",box).forEach(b=>b.addEventListener("click",async()=>{
      const id=b.getAttribute("data-cancel");
      b.disabled=true; b.textContent="…";
      try{
        await api("/api/reservations/cancel",{method:"POST",body:JSON.stringify({
          reservation_id:Number(id), user_id:Number($("#sel-user").value), reason:"控制台取消"})});
        toast("已取消预约 #"+id,"ok");
        loadReservations(); loadHealth();
      }catch(e){ toast("取消失败："+e.message,"err"); b.disabled=false; b.textContent="取消"; }
    }));
  }catch(e){box.innerHTML='<div class="empty">加载失败：'+esc(e.message)+"</div>";}
}

/* ---------- 规范检索 ---------- */
async function runRetrieve(){
  const q=$("#inp-q").value.trim();
  if(!q){toast("先输入检索词","err");return;}
  const box=$("#kb-box");
  box.innerHTML=skel(3,"row");
  try{
    const r=await api("/api/retrieve?q="+encodeURIComponent(q)+"&k=4");
    if(!r.hits.length){box.innerHTML='<div class="empty">没有命中</div>';return;}
    box.innerHTML=`<div class="hint">后端 ${esc(r.backend)} · 语料 ${r.stats.chunks||"-"} 条${r.degraded_reason?" · 降级原因："+esc(r.degraded_reason):""}</div>`
      + r.hits.map(h=>{
        const by=(h.matched_by||[]).length?` <span class="tag">${esc(h.matched_by.join("+"))}</span>`:"";
        return `<div class="cite"><div class="h">${esc(h.heading)}${by}</div>
          <div class="x">${esc(h.text.slice(0,150))}${h.text.length>150?"…":""}</div>
          <div class="s">score ${h.score}</div></div>`;
      }).join("");
  }catch(e){box.innerHTML='<div class="empty">检索失败：'+esc(e.message)+"</div>";}
}

/* ---------- 对话 ---------- */
function pushMsg(role,html,kind){
  const el=document.createElement("div");
  el.className="msg "+role+(kind?(" "+kind):"");
  el.innerHTML=`<div class="who">${role==="u"?"我":"AI"}</div><div class="bub">${html}</div>`;
  $("#msgs").appendChild(el);
  $("#msgs").scrollTop=$("#msgs").scrollHeight;
  return el;
}
function skeletonMsg(){
  return pushMsg("a",'<div class="skel" style="height:14px;width:70%"></div><div class="skel" style="height:14px;width:45%;margin-top:7px"></div>');
}
function renderProposals(list){
  if(!list||!list.length) return "";
  return '<div class="props">'+list.map((p,i)=>{
    const relax=(p.relaxations||[]).length
      ? '<div class="relax">'+p.relaxations.map(r=>`<span class="rc">${esc(r)}</span>`).join("")+"</div>"
      : '<div class="relax"><span class="rc" style="background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent)">完全满足</span></div>';
    return `<div class="prop"><span class="idx">${i+1}</span><div class="main">
      <div class="line1">${esc(p.equipment_name)}<span style="color:var(--text-faint);font-weight:400"> · ${esc(p.lab_label)}</span></div>
      <div class="line2">${esc(p.date)} ${esc(p.start)}-${esc(p.end)} · ${p.hours}h</div>
      ${relax}</div>
      <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
        <span class="score">${p.score}</span>
        <button class="btn sm" data-accept="${i}">选这个</button>
      </div></div>`;
  }).join("")+"</div>";
}
function renderTrace(trace){
  if(!trace||!trace.length) return "";
  const max=Math.max.apply(null,trace.map(t=>t.elapsed_ms||0))||1;
  return '<div class="trace"><div style="font-size:11px;color:var(--text-faint);margin-bottom:6px">执行轨迹</div><div class="tl">'
    + trace.map(t=>`<div class="tlrow"><span class="n">${esc(t.node)}</span>
        <span><span class="bar" style="width:${Math.max(2,(t.elapsed_ms/max)*100).toFixed(1)}%;display:inline-block"></span>
        <span class="d" style="margin-left:6px">${esc(t.detail)}</span></span>
        <span class="m">${t.elapsed_ms}ms</span></div>`).join("")
    + "</div></div>";
}
function renderCitations(list){
  if(!list||!list.length) return "";
  return '<div style="margin-top:10px">'+list.map(h=>
    `<div class="cite"><div class="h">${esc(h.heading)}</div>
     <div class="x">${esc(h.text.slice(0,160))}${h.text.length>160?"…":""}</div>
     <div class="s">${esc(h.source)} · score ${h.score}</div></div>`).join("")+"</div>";
}

let lastProposals=[];
async function send(message,accept){
  if(state.busy) return;
  const text=(message||"").trim();
  if(!text && !accept){toast("说点什么再发","err");return;}
  state.busy=true; $("#btn-send").disabled=true; $("#hint-inline").textContent="";
  if(text) pushMsg("u",esc(text));
  $("#inp-msg").value="";
  const ph=skeletonMsg();

  const payload={message:text||"就选这个",user_id:Number($("#sel-user").value),session_id:state.session};
  if(accept){
    payload.accept_equipment_id=accept.equipment_id;
    payload.accept_date=accept.date;
    payload.accept_start=accept.start;
    payload.accept_end=accept.end;
  }
  try{
    const r=await api("/api/agent/chat",{method:"POST",body:JSON.stringify(payload)});
    ph.remove();
    lastProposals=r.proposals||[];
    let html=esc(r.reply);
    if(r.booking&&r.booking.reservation){
      const b=r.booking;
      html+='<div style="margin-top:8px"><span class="tag '+(b.ok?"ok":"bad")+'">'
        + (b.ok?"已下单":"下单失败")+"</span> <span class='mono'>"
        + esc(b.reservation.slot||"")+"</span>"
        + (b.retries?` <span class="tag warn">重试 ${b.retries} 次</span>`:"")+"</div>";
    }else if(r.booking&&!r.booking.ok){
      html+='<div style="margin-top:8px"><span class="tag bad">'+esc(r.booking.message)+"</span></div>";
    }
    if(r.degraded) html+='<div style="margin-top:8px"><span class="tag warn">降级模式</span></div>';
    html+=renderProposals(r.proposals);
    html+=renderCitations(r.citations);
    html+=renderTrace(r.trace);
    const el=pushMsg("a",html);
    $$("[data-accept]",el).forEach(btn=>btn.addEventListener("click",()=>{
      const p=lastProposals[Number(btn.getAttribute("data-accept"))];
      if(p) send("选：" + p.equipment_name + " " + p.date + " " + p.start + "-" + p.end, p);
    }));
    if(r.booking&&r.booking.ok){ loadReservations(); loadHealth(); }
  }catch(e){
    ph.remove();
    pushMsg("a",esc("出错了："+e.message),"err");
    toast(e.message,"err");
  }finally{
    state.busy=false; $("#btn-send").disabled=false;
  }
}

/* ---------- 交互绑定 ---------- */
const QUICK=["明天下午两点想用荧光光谱仪两小时","明天上午十点到十一点，紫外可见分光光度计",
  "离心机使用有什么安全规范","我想约个设备"];
$("#quick").innerHTML=QUICK.map(q=>`<button class="btn ghost sm" data-q="${esc(q)}">${esc(q)}</button>`).join("");
$$("[data-q]").forEach(b=>b.addEventListener("click",()=>{
  $("#inp-msg").value=b.getAttribute("data-q");
  $("#hint-inline").textContent="";
  send($("#inp-msg").value);
}));

$("#btn-send").addEventListener("click",()=>send($("#inp-msg").value));
$("#inp-msg").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();send($("#inp-msg").value);}
});
$("#inp-msg").addEventListener("input",()=>{
  const v=$("#inp-msg").value;
  $("#hint-inline").textContent=v.length>2000?("超出长度上限（"+v.length+"/2000）"):"Ctrl + Enter 发送";
  $("#btn-send").disabled=v.length>2000||state.busy;
});
$("#btn-reset").addEventListener("click",()=>{
  state.session="web-"+Math.random().toString(36).slice(2,8);
  $("#msgs").innerHTML="";
  pushMsg("a","已开新会话。上一轮的备选方案不会再被引用。");
});
$("#sel-user").addEventListener("change",()=>loadReservations());
$("#flt-user").addEventListener("change",loadReservations);
$("#flt-status").addEventListener("change",loadReservations);
$("#btn-q").addEventListener("click",runRetrieve);
$("#inp-q").addEventListener("keydown",e=>{if(e.key==="Enter")runRetrieve();});

$$("#tabs .tab").forEach(tab=>tab.addEventListener("click",()=>{
  $$("#tabs .tab").forEach(t=>t.classList.toggle("on",t===tab));
  const name=tab.getAttribute("data-tab");
  ["labs","res","kb"].forEach(k=>{$("#pane-"+k).hidden = k!==name;});
  if(name==="res") loadReservations();
  if(name==="labs") loadLabs();
}));

/* ---------- 启动 ---------- */
(async function boot(){
  await loadHealth();
  await Promise.all([loadUsers(),loadLabs()]);
  await loadReservations();
})();
})();
</script>
</body>
